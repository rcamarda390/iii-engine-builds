name: Build & Push iii-engine v0.11.2

on:
  push:
    branches: [ main ]
    paths:
      - 'Dockerfile'
      - '.github/workflows/build-iii-0.11.2.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 0'  # Weekly build (Sunday 2 AM UTC)

env:
  IMAGE_NAME: iiidev/iii
  VERSION: 0.11.2

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.8.0
        with:
          driver-options: |
            image=moby/buildkit:v0.14.1

      - name: Build Docker image (using pre-built binary)
        uses: docker/build-push-action@v6.11.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.VERSION }}
            ${{ env.IMAGE_NAME }}:latest
          outputs: type=docker,dest=/tmp/image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check image build
        run: |
          echo "✓ Docker image built successfully"
          ls -lh /tmp/image.tar

      - name: Load and test image
        run: |
          docker load --input /tmp/image.tar
          echo "Testing iii binary..."
          docker run --rm ${{ env.IMAGE_NAME }}:${{ env.VERSION }} --version
          echo "✓ Binary works!"

      - name: Save multi-tag image
        run: |
          docker save -o /tmp/iii-engine-0.11.2.tar \
            ${{ env.IMAGE_NAME }}:${{ env.VERSION }} \
            ${{ env.IMAGE_NAME }}:latest
          echo "Image saved:"
          ls -lh /tmp/iii-engine-0.11.2.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4.4.0
        with:
          name: iii-engine-0.11.2-image
          path: /tmp/iii-engine-0.11.2.tar
          retention-days: 30
          compression-level: 0

      - name: Generate build metadata
        run: |
          cat > /tmp/image-info.txt << 'EOF'
          ========================================
          iii-engine v0.11.2 Docker Image
          ========================================
          
          Build Details:
          - Image: iiidev/iii:0.11.2
          - Built: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          - Commit: ${GITHUB_SHA:0:7}
          - Workflow: Build & Push iii-engine v0.11.2
          - Source: https://github.com/iii-hq/iii/releases/tag/iii/v0.11.2
          
          Import to Airgapped Artifactory:
          ========================================
          
          1. Download artifact from Actions → Artifacts
             Name: iii-engine-0.11.2-image
          
          2. Transfer to airgapped host
          
          3. Load image locally:
             $ docker load < iii-engine-0.11.2.tar
          
          4. Tag for artifactory:
             $ export DOMAIN="your.artifactory.domain"
             $ docker tag iiidev/iii:0.11.2 artifactory.${DOMAIN}/docker-local/iiidev/iii:0.11.2
             $ docker tag iiidev/iii:latest artifactory.${DOMAIN}/docker-local/iiidev/iii:latest
          
          5. Login to artifactory (if needed):
             $ docker login artifactory.${DOMAIN}
             Username: [your-username]
             Password: [your-token]
          
          6. Push to artifactory:
             $ docker push artifactory.${DOMAIN}/docker-local/iiidev/iii:0.11.2
             $ docker push artifactory.${DOMAIN}/docker-local/iiidev/iii:latest
          
          7. Verify in artifactory:
             $ docker pull artifactory.${DOMAIN}/docker-local/iiidev/iii:0.11.2
             $ docker run --rm artifactory.${DOMAIN}/docker-local/iiidev/iii:0.11.2 --version
          
          Use in agentmemory Dockerfile:
          ========================================
          
          FROM node:20-slim
          
          RUN npm config set registry https://npm-authorized.${DOMAIN}
          
          WORKDIR /app
          COPY package.json package-lock.json ./
          RUN npm ci
          
          COPY . .
          RUN npm run build
          
          # Copy iii binary from artifactory
          COPY --from=artifactory.${DOMAIN}/docker-local/iiidev/iii:0.11.2 /app/iii /app/iii
          
          EXPOSE 3111 3112 3113
          CMD ["npm", "start"]
          
          ========================================
          EOF
          cat /tmp/image-info.txt

      - name: Upload build info
        uses: actions/upload-artifact@v4.4.0
        with:
          name: iii-engine-0.11.2-info
          path: /tmp/image-info.txt

      - name: Workflow summary
        run: |
          echo ""
          echo "========================================="
          echo "✓ Build Complete!"
          echo "========================================="
          echo ""
          echo "Image: ${{ env.IMAGE_NAME }}:${{ env.VERSION }}"
          echo "Size: $(du -h /tmp/iii-engine-0.11.2.tar | cut -f1)"
          echo "Tags: :0.11.2 and :latest"
          echo ""
          echo "Next Steps:"
          echo "1. Download 'iii-engine-0.11.2-image' artifact"
          echo "2. Transfer to airgapped host"
          echo "3. docker load < iii-engine-0.11.2.tar"
          echo "4. docker tag iiidev/iii:0.11.2 artifactory.\${DOMAIN}/docker-local/iiidev/iii:0.11.2"
          echo "5. docker push artifactory.\${DOMAIN}/docker-local/iiidev/iii:0.11.2"
          echo ""
          echo "See 'iii-engine-0.11.2-info' artifact for detailed instructions"
          echo "========================================="
